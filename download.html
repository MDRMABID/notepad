<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>APK ডাউনলোড · মার্জিনাল</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #f9f6f0;
            color: #2b2a26;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 20% 30%, #f4e9e2 0%, transparent 55%),
                        radial-gradient(circle at 80% 70%, #f5ede0 0%, transparent 45%),
                        #f9f6f0;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 253, 249, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 32px;
            padding: 40px 32px;
            border: 1px solid rgba(231, 226, 216, 0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.06);
            text-align: center;
        }
        .icon { font-size: 72px; margin-bottom: 16px; }
        h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
        h1 span { color: #d8a48f; }
        .sub { color: #6b6963; margin-top: 8px; font-size: 15px; line-height: 1.6; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 40px;
            border-radius: 100px;
            font-size: 16px;
            font-weight: 600;
            background: #2b2a26;
            color: #f9f6f0;
            border: none;
            cursor: pointer;
            text-decoration: none;
            margin-top: 24px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(0,0,0,0.12); }
        .btn-back {
            background: transparent;
            color: #6b6963;
            border: 1.5px solid #e7e2d8;
            margin-top: 12px;
            padding: 14px 32px;
        }
        .btn-back:hover { background: #f5f1ea; border-color: #d8a48f; }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 20px;
        }
        .feature {
            background: #f5f1ea;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 500;
            border: 1px solid #ede8df;
        }
        .foot { margin-top: 20px; font-size: 12px; color: #9a9892; }
        @media (max-width: 400px) {
            .container { padding: 28px 20px; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📦</div>
        <h1>মার্জিনাল <span>APK</span></h1>
        <p class="sub">আপনার অ্যান্ড্রয়েড ডিভাইসে অ্যাপটি ইনস্টল করতে নিচের বাটনে ক্লিক করুন।</p>

        <!-- ===== এখানে আপনার আসল APK ফাইলের লিংক দিন ===== -->
        <a href="#" class="btn" id="downloadApk">
            <span>⬇️</span> APK ডাউনলোড (v1.0.0)
        </a>

        <a href="https://mdrmabid.github.io/notepad/" class="btn btn-back">
            <span>◀</span> ফিরে যান
        </a>

        <div class="features">
            <div class="feature">📱 অফলাইন</div>
            <div class="feature">🔒 প্রাইভেট</div>
            <div class="feature">⚡ ফাস্ট</div>
            <div class="feature">🎨 মিনিমাল</div>
        </div>

        <div class="foot">১০০% অফলাইন · এই ডিভাইসে সংরক্ষিত</div>
    </div>

    <script>
        // APK ডাউনলোড বাটনের জন্য
        const btn = document.getElementById('downloadApk');
        btn.addEventListener('click', function(e) {
            // এখানে আপনার আসল APK ফাইলের লিংক দিন
            // যদি ফাইল আপলোড না থাকে, তাহলে মেসেজ দেখাবে
            if (this.getAttribute('href') === '#') {
                e.preventDefault();
                alert('⚠️ APK ফাইল এখনও আপলোড করা হয়নি।\n\nদয়া করে ডেভেলপারের সাথে যোগাযোগ করুন।');
            }
        });
    </script>
</body>
</html>
